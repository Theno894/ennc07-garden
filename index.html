<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>灵感花园 · Insight Garden</title>
<meta name="description" content="慢慢看见自己靠近了什么">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f4a3c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="灵感花园">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500&family=Zhi+Mang+Xing&family=Long+Cang&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --paper:#f2efe6; --paper2:#f7f5ee; --card:#fdfcf8; --line:#e5e1d3;
  --ink:#223428; --ink2:#41523f; --mute:#8a8d7c;
  --grow:#a9822c; --done:#4a6b52; --settle:#9c6a4e; --wait:#5f7d99; --seed:#6d7580; --release:#8d8d85;
  --accent:#2f4a3c; --danger:#a2543f;
  --serif:'Noto Serif SC',serif; --sans:'Noto Sans SC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(180deg,var(--paper) 0%,var(--paper2) 100%);color:var(--ink);font-family:var(--sans);min-height:100vh;font-size:15px;line-height:1.7}
a{color:inherit;text-decoration:none}
button{font-family:var(--sans);cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font-size:14px;transition:.15s}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fdfcf8;border-color:var(--accent)}
button.ghost{background:transparent;border:none;color:var(--mute);padding:4px 8px}
input,textarea,select{font-family:var(--sans);font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:120px;resize:vertical;line-height:1.8}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}

header.top{position:sticky;top:0;z-index:20;background:rgba(242,239,230,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:14px 20px}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:30px;height:30px}
.logo .t1{font-family:var(--serif);font-weight:900;font-size:19px;line-height:1.2}
.logo .t2{font-size:10px;letter-spacing:.25em;color:var(--mute)}
nav.desk{display:flex;gap:22px;margin-left:26px;font-size:14.5px}
nav.desk a{color:var(--ink2);padding:4px 2px;border-bottom:2px solid transparent}
nav.desk a.on{color:var(--ink);border-color:var(--accent);font-weight:500}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13.5px;color:var(--mute)}

main{max-width:1120px;margin:0 auto;padding:34px 20px 110px}
.eyebrow{font-size:12.5px;letter-spacing:.12em;color:var(--accent);font-weight:500;margin-bottom:10px}
h1.hero{font-family:var(--serif);font-weight:900;font-size:clamp(28px,4.6vw,44px);line-height:1.25;margin-bottom:10px}
.sub{color:var(--mute);margin-bottom:26px}
h2.sec{font-family:var(--serif);font-weight:600;font-size:21px;margin:34px 0 14px}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.card h3{font-family:var(--serif);font-weight:600;font-size:17.5px;margin:6px 0}
.card .desc{color:var(--ink2);font-size:14px}
.muted{color:var(--mute);font-size:13.5px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border-radius:999px;padding:3px 11px;background:var(--paper);border:1px solid var(--line);color:var(--ink2)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.chip.seed .dot{background:var(--seed)} .chip.growing .dot{background:var(--grow)}
.chip.waiting .dot{background:var(--wait)} .chip.done .dot{background:var(--done)}
.chip.settled .dot{background:var(--settle)} .chip.released .dot{background:var(--release)}
.chip.sel{background:var(--accent);color:#fdfcf8;border-color:var(--accent)}
.chip.click{cursor:pointer}

.bar{height:7px;border-radius:99px;background:var(--paper);border:1px solid var(--line);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#5b7a5e,#31493a);border-radius:99px}

.bignum{font-family:var(--serif);font-weight:900;font-size:34px}
.note{background:#e7ebe9;border:1px solid #d5dcd8;border-radius:16px;padding:16px 20px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--accent);color:#fdfcf8;padding:10px 18px;border-radius:12px;font-size:14px;z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}

nav.mob{display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:30;background:rgba(253,252,248,.95);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 30px rgba(34,52,40,.10);padding:8px 6px}
nav.mob .wrap{display:flex;justify-content:space-around;align-items:center}
nav.mob a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mute);padding:4px 8px}
nav.mob a .ic{width:30px;height:30px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:13px;font-family:var(--serif)}
nav.mob a.on{color:var(--ink)} nav.mob a.on .ic{background:var(--accent);color:#fdfcf8}

.login-wrap{max-width:420px;margin:12vh auto 0;padding:0 20px}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 28px;text-align:center}
.login-card h1{font-family:var(--serif);font-weight:900;font-size:26px;margin-bottom:6px}
.login-card p{color:var(--mute);font-size:14px;margin-bottom:20px}
.login-card input{text-align:center;margin-bottom:12px}
.hidden{display:none!important}
.growcard{cursor:pointer}
.card-tools{display:none}
.growcard.open .card-tools{display:block}
.tool-hint{font-size:12px;margin-top:10px;text-align:right;user-select:none}
.projcard{cursor:pointer;transition:border-color .15s}
.projcard:hover{border-color:var(--accent)}
.modal-mask{position:fixed;inset:0;background:rgba(34,52,40,.34);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px;max-width:640px;width:100%;padding:24px 26px;box-shadow:0 20px 60px rgba(34,52,40,.22)}
.modal h2{font-family:var(--serif);font-weight:900;font-size:22px;margin:6px 0}
.check{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
.check:first-of-type{border-top:none}
.check input{width:auto}
.check .tt{flex:1}
.check .tt.done{text-decoration:line-through;color:var(--mute)}
.timeline{border-left:2px solid var(--line);padding-left:14px}
.timeline .ev{position:relative;padding:6px 0}
.timeline .ev::before{content:'';position:absolute;left:-19px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--done)}
.itemline{border-top:1px dashed var(--line);padding:10px 0;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.itemline:first-of-type{border-top:none}
.cap-grid{display:grid;gap:14px;grid-template-columns:1.6fr 1fr}
.card-done{opacity:.66}
/* ——— 手账风(make it happen):手写字 + washi 胶带 + 异形圆角 + 手绘波浪 ——— */
:root{
  --yellow:#f2c94c; --mist:#9db8c4; --pink:#e8a0a2; --trunk:#b07d4f; --inkdeep:#22382c;
  --hand-zh:"HanziPen SC","Wawati SC","Yuanti SC","Kaiti SC",var(--serif);
  --hand-mix:"Bradley Hand","Marker Felt","Chalkboard SE","Comic Sans MS","HanziPen SC","Wawati SC","Yuanti SC","Kaiti SC",cursive;
}
h1.hero{font-family:var(--hand-zh);font-weight:500;line-height:1.32;transform:rotate(-1deg);transform-origin:left center}
h2.sec{font-family:var(--hand-zh);font-weight:500;font-size:24px}
.modal h2{font-family:var(--hand-zh);font-weight:500}
.eyebrow{font-family:var(--hand-zh);font-size:20px;letter-spacing:1px;color:var(--ink2)}
.card h3{font-family:var(--hand-zh);font-weight:500}
.bignum,.exp,#date-label{font-family:var(--hand-mix)}
/* washi 胶带条:暖黄 + 微旋转 + 撕边 */
.washi{display:inline-block;padding:3px 14px 4px;background:var(--yellow);color:var(--inkdeep);
  font-family:var(--hand-zh);font-size:13px;line-height:1.45;transform:rotate(-1.5deg);
  clip-path:polygon(2% 14%,3.5% 0,96.5% 3%,100% 16%,98.5% 86%,96% 100%,2.5% 95%,0 80%)}
/* 关键词异形高亮 */
.kw{position:relative;display:inline-block;padding:0 .12em;color:var(--accent);transform:rotate(-1.4deg);z-index:0}
.kw::before{content:"";position:absolute;left:-7%;right:-7%;top:.12em;bottom:.04em;background:var(--yellow);opacity:.45;
  border-radius:.24em .32em .22em .36em / .32em .22em .36em .22em;transform:rotate(-.9deg);z-index:-1}
/* 有机异形圆角卡片 */
.card{border-radius:22px 18px 24px 16px / 18px 24px 16px 22px}
.card:nth-of-type(even){border-radius:18px 24px 16px 22px / 24px 18px 22px 16px}
.modal{border-radius:24px 20px 26px 18px / 20px 26px 18px 24px}
button{border-radius:16px 13px 15px 12px / 13px 16px 12px 15px}
.dashed{border:2px dashed var(--line);border-radius:20px 16px 22px 15px / 16px 22px 15px 20px;background:transparent}
/* 手绘波浪分隔 */
.wave{height:9px;margin:11px 0 9px;opacity:.42;background-repeat:repeat-x;background-size:24px 9px;
  background-image:radial-gradient(circle at 6px 9px,transparent 5.4px,var(--sage,#4a6b52) 5.4px,var(--sage,#4a6b52) 6.6px,transparent 6.6px),radial-gradient(circle at 18px 0,transparent 5.4px,var(--sage,#4a6b52) 5.4px,var(--sage,#4a6b52) 6.6px,transparent 6.6px)}
.doodle{display:inline-flex;align-items:center;gap:7px;vertical-align:middle}
.doodle svg{display:block;overflow:visible}
.bean{animation:floaty 6s ease-in-out infinite;transform-origin:55% 85%}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-4px) rotate(1deg)}}
/* ——— 微动效 ——— */
/* 1. 输入框聚焦:手绘虚线框(真虚线,跟随圆角) */
input,textarea{transition:outline-color .18s ease,background-color .18s ease;
  border-radius:16px 13px 15px 12px / 13px 16px 12px 15px}
input:focus,textarea:focus{outline:2px dashed var(--accent);outline-offset:3px;background:var(--card)}
/* 2. 点击反馈 */
button{transition:transform .12s ease,border-color .15s ease,background-color .15s ease,box-shadow .15s ease}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(1px) scale(.985)}
.chip.click{transition:transform .12s ease,background-color .15s ease}
.chip.click:active{transform:scale(.94)}
.card{transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.projcard:hover,.growcard:hover{transform:translateY(-2px)}
.itemline.click{transition:background-color .15s ease,padding-left .15s ease}
.itemline.click:hover{padding-left:6px}
/* 3. 出现:错落淡入 */
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
#view .card,#view .dashed{animation:riseIn .34s ease both}
#view .grid>*:nth-child(2){animation-delay:.05s}
#view .grid>*:nth-child(3){animation-delay:.1s}
#view .grid>*:nth-child(4){animation-delay:.14s}
#view .grid>*:nth-child(5){animation-delay:.18s}
@keyframes popIn{0%{opacity:0;transform:scale(.94) translateY(8px)}60%{transform:scale(1.01)}100%{opacity:1;transform:scale(1) translateY(0)}}
.modal{animation:popIn .26s ease both}
.modal-mask{animation:fadeIn .2s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* 4. 进度条平滑生长 */
.bar i{transition:width .7s cubic-bezier(.34,1.3,.64,1)}
/* 5. 情绪时刻 */
@keyframes cheer{0%{transform:scale(1)}35%{transform:scale(1.18) rotate(-7deg)}70%{transform:scale(.97) rotate(4deg)}100%{transform:scale(1)}}
.cheer{animation:cheer .55s ease}
@keyframes heartbeat{0%,100%{transform:scale(1)}25%{transform:scale(1.22)}50%{transform:scale(.96)}75%{transform:scale(1.1)}}
.heartbeat{animation:heartbeat .7s ease}
@keyframes sparkle{0%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(90deg)}100%{opacity:0;transform:scale(.7) rotate(180deg)}}
.spark{position:fixed;pointer-events:none;font-size:20px;z-index:120;animation:sparkle .75s ease forwards}
.toast{transition:opacity .25s ease,transform .25s ease}
.toast.show{transform:translateX(-50%) translateY(-4px)}
/* 6. 尊重"减少动态效果" */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
.chip{white-space:nowrap}
.itemline{gap:10px}
.itemline>div{min-width:0}
.itemline .chip{flex-shrink:0}
.spread>.chip,.spread .row{flex-shrink:0}
.srcpill{display:inline-block;background:var(--paper);border:1px solid var(--line);border-radius:999px;
  padding:0 7px;font-size:11px;color:var(--ink2);text-decoration:none;white-space:nowrap;margin-left:3px}
.itemline.click{cursor:pointer;border-radius:8px}
.itemline.click:hover{background:var(--paper)}
.exp{font-weight:500}
.small-in{width:auto;flex:1}
@media (max-width:760px){
  nav.desk{display:none} nav.mob{display:block} main{padding-top:24px}
  #date-label{display:none}
  .logo .t2, .logo br{display:none}
  .logo .t1{font-size:18px}
  .logo svg{width:26px;height:26px}
  .topbar{padding:12px 16px;gap:8px}
  .top-right{gap:8px;margin-left:auto}
  .top-right button{white-space:nowrap;padding:6px 10px;font-size:13px}
  .cap-grid{grid-template-columns:1fr}
  .g3{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="top" id="hdr">
  <div class="topbar">
    <a class="logo" href="#today">
      <svg viewBox="0 0 32 32"><circle cx="13" cy="21" r="8" fill="#2f4a3c"/><path d="M14 20 C14 10, 22 4, 30 4 C30 14, 22 20, 14 20 Z" fill="#4a6b52"/></svg>
      <span><span class="t1">灵感花园</span><br><span class="t2">INSIGHT GARDEN</span></span>
    </a>
    <nav class="desk" id="nav-desk"></nav>
    <div class="top-right"><span id="date-label"></span><button class="ghost" id="btn-setpass" title="设置密码">设密码</button><button class="ghost" id="btn-logout" title="退出登录">退出</button></div>
  </div>
</header>

<div class="login-wrap hidden" id="login-view">
  <div class="login-card">
    <h1>灵感花园</h1>
    <p>用邮箱 + 密码登录。第一次没有密码?用下面的邮件链接先进来,再设密码。</p>
    <input type="email" id="login-email" placeholder="你的邮箱" autocomplete="email">
    <input type="password" id="login-pass" placeholder="密码" autocomplete="current-password" style="margin-top:10px">
    <button class="primary" id="btn-pass" style="width:100%;margin-top:12px">登录</button>
    <p class="muted" id="login-msg" style="margin-top:14px"></p>
    <div style="border-top:1px solid var(--line);margin-top:16px;padding-top:14px">
      <button class="ghost" id="btn-magic" style="width:100%">第一次?发一封邮件链接给我</button>
      <div id="otp-box" class="hidden" style="margin-top:10px">
        <input type="text" id="login-code" placeholder="或输入邮件里的 6 位码" inputmode="numeric" autocomplete="one-time-code" style="text-align:center;letter-spacing:4px">
        <button id="btn-verify" style="width:100%;margin-top:8px">用验证码进入</button>
      </div>
    </div>
  </div>
</div>

<main id="view"></main>

<nav class="mob" id="nav-mob"></nav>
<div class="toast" id="toast"></div>

<script>
/* ================= 配置(部署时唯二要改的地方) ================= */
const SUPABASE_URL      = 'https://pclcxosllotopkrevqtp.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_JmFJq9iR32egjetXxvOTtw_Y88-BJEI'; // publishable key,可公开
const OWNER_NAME = 'Dou';

/* ================= 基础 ================= */
const configured = SUPABASE_URL.startsWith('https://');
const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let session = null;

const $  = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmtMD = s => { if(!s) return ''; const d = new Date(s); return (d.getMonth()+1)+'/'+String(d.getDate()).padStart(2,'0'); };
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
/* 情绪时刻:在元素附近撒一小把星星 */
function celebrate(el, chars){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const r = (el||document.body).getBoundingClientRect();
  const set = chars || ['✦','✧','·','✦'];
  set.forEach((c,i)=>{
    const s = document.createElement('div');
    s.className='spark'; s.textContent=c;
    s.style.left = (r.left + r.width*(0.2+0.2*i) + (Math.random()*14-7)) + 'px';
    s.style.top  = (r.top + r.height*0.3 - Math.random()*18) + 'px';
    s.style.animationDelay = (i*0.06)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 900 + i*60);
  });
}
function bounce(el, cls){ if(!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(()=>el.classList.remove(cls), 800); }
/* Markdown 渲染:表格 / 事实推断标签 / 置信度 / 来源,全部转成花园风格 */
const TAGSTYLE = { '事实':['#e7f0ea','#2f4a3c'], '推断':['#faeeda','#854f0b'], '假设':['#eceff1','#5f5e5a'] };
function md(src){
  if (!src) return '';
  const lines = String(src).replace(/\r/g,'').split('\n');
  let out = '', inList = false, i = 0;
  const inline = s => {
    let h = esc(s);
    // 来源链接 ([名字](url "标题")) → 小小的"来源"标签
    h = h.replace(/\(\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;[^)]*&quot;)?\)\)/g,
      ' <a href="$2" target="_blank" rel="noopener" class="srcpill">🔗 $1</a>');
    h = h.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;[^)]*&quot;)?\)/g,
      '<a href="$2" target="_blank" rel="noopener" style="color:var(--accent)">$1</a>');
    // 【事实】【推断】【假设】 → 彩色小标签
    h = h.replace(/【(事实|推断|假设)】/g, (_,k)=>{ const c=TAGSTYLE[k];
      return `<span style="background:${c[0]};color:${c[1]};border-radius:5px;padding:1px 6px;font-size:11.5px;margin:0 2px">${k}</span>`; });
    h = h.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    h = h.replace(/`(.+?)`/g, '<code style="background:var(--paper);padding:1px 4px;border-radius:4px;font-size:.92em">$1</code>');
    return h;
  };
  const closeList = () => { if (inList){ out += '</ul>'; inList = false; } };
  while (i < lines.length){
    const raw = lines[i], t = raw.trim();
    // 表格
    if (t.startsWith('|') && (lines[i+1]||'').trim().match(/^\|[\s:|-]+\|$/)){
      closeList();
      const cells = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head = cells(t); i += 2;
      let body = '';
      while (i < lines.length && lines[i].trim().startsWith('|')){
        body += '<tr>' + cells(lines[i]).map(c=>`<td style="padding:6px 9px;border-top:1px solid var(--line);vertical-align:top">${inline(c)}</td>`).join('') + '</tr>';
        i++;
      }
      out += `<div style="overflow-x:auto;margin:9px 0"><table style="width:100%;border-collapse:collapse;font-size:12.8px;background:var(--card);border-radius:10px;overflow:hidden">
        <thead><tr>${head.map(c=>`<th style="padding:7px 9px;text-align:left;background:var(--paper);font-weight:500;color:var(--accent);white-space:nowrap">${inline(c)}</th>`).join('')}</tr></thead>
        <tbody>${body}</tbody></table></div>`;
      continue;
    }
    i++;
    if (!t){ closeList(); continue; }
    let m;
    // 置信度行 → 徽章
    if ((m = t.match(/^\*{0,2}置信度[：:]\*{0,2}\s*(.+)$/))){
      closeList();
      out += `<div style="margin:7px 0"><span style="background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:11.5px;color:var(--ink2)">置信度 · ${inline(m[1].replace(/\*/g,''))}</span></div>`;
      continue;
    }
    if (/^---+$/.test(t)){ closeList(); out += '<div class="wave"></div>'; }
    else if ((m = t.match(/^#\s+(.*)/))){ closeList(); out += `<div style="font-family:var(--hand-zh);font-size:20px;color:var(--ink);margin:2px 0 8px">${inline(m[1])}</div>`; }
    else if ((m = t.match(/^##\s+(.*)/))){ closeList(); out += `<div style="font-family:var(--hand-zh);font-weight:500;font-size:17px;margin:18px 0 6px;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:3px">${inline(m[1])}</div>`; }
    else if ((m = t.match(/^#{3,6}\s+(.*)/))){ closeList(); out += `<div style="font-weight:500;margin:12px 0 4px;font-size:14.5px">${inline(m[1])}</div>`; }
    else if ((m = t.match(/^>\s?(.*)/))){ closeList(); out += `<div style="border-left:3px solid var(--yellow);background:var(--paper);padding:7px 11px;margin:8px 0;border-radius:0 8px 8px 0;color:var(--ink2)">${inline(m[1])}</div>`; }
    // 小节标签行(如 **发生了什么｜【事实】**)
    else if ((m = t.match(/^\*\*(.{2,20}?)｜(【[^】]+】)\*\*$/))){
      closeList();
      out += `<div style="margin:10px 0 3px;font-weight:500;font-size:13.5px">${esc(m[1])} ${inline(m[2])}</div>`;
    }
    else if ((m = t.match(/^[-*+]\s+(.*)/)) || (m = t.match(/^\d+[.)]\s+(.*)/))){
      if (!inList){ out += '<ul style="margin:4px 0 4px 16px">'; inList = true; }
      out += `<li style="margin-bottom:3px">${inline(m[1])}</li>`;
    }
    else { closeList(); out += `<p style="margin:5px 0">${inline(t)}</p>`; }
  }
  closeList();
  return out;
}

/* ===== 语言学习状态机 =====
   new → flashcard_learning → exam_ready → mastered / suspended
   ⚠️ 间隔用 success_streak,不能用 lifetime_review_count —— 后者只增不减,
      失败多次的词会算出天文数字的间隔,从队列里静默消失 */
const EXAM_STREAK = 3, EXAM_SPAN_DAYS = 8;
const streakOf  = i => (i.success_streak ?? i.review_count ?? 0);
const langDue   = i => !i.last_reviewed_at ||
  (Date.now() - new Date(i.last_reviewed_at).getTime()) > Math.pow(2, streakOf(i)) * 86400000;
/* 在闪卡队列里的:排除已长成、待毕业考、已放下 */
const inFlashcards = i => !i.mastered && !['mastered','exam_ready','suspended'].includes(i.status||'');
const flashDue  = i => inFlashcards(i) && langDue(i);
/* 够不够格毕业:连胜 ≥3 次,且本轮连胜首尾跨度 ≥8 天 */
const canGraduate = (streak, firstAt) =>
  streak >= EXAM_STREAK && !!firstAt &&
  (Date.now() - new Date(firstAt).getTime()) >= EXAM_SPAN_DAYS * 86400000;

/* 把 Live 给的 PASS/FAIL/NEW 几行解析出来 */
function parseExamResult(txt, pool){
  const norm = s => String(s||'').trim().toLowerCase()
    .replace(/^[·\-*•\s]+/,'').replace(/[.。!！?？,，]+$/,'').replace(/\s+/g,' ');
  const out = { pass:[], fail:[], nw:[], unknown:[] };
  for (const raw of String(txt||'').split('\n')){
    const parts = raw.trim().split(/[｜|]/).map(s=>s.trim());
    const tag = (parts[0]||'').toUpperCase().replace(/[^A-Z]/g,'');
    if (!['PASS','FAIL','NEW'].includes(tag)) continue;
    const expr = parts[1]; if (!expr) continue;
    if (tag === 'NEW'){ out.nw.push({ expression:expr, meaning:parts[2]||'', example:parts[3]||'' }); continue; }
    const n = norm(expr);
    const hit = pool.find(i => norm(i.expression) === n)
             || pool.find(i => norm(i.expression).includes(n) || n.includes(norm(i.expression)));
    if (!hit){ out.unknown.push(expr); continue; }
    if (out.pass.some(x=>x.item.id===hit.id) || out.fail.some(x=>x.item.id===hit.id)) continue;  // 同一个词只算一次
    (tag==='PASS' ? out.pass : out.fail).push({ item:hit, note:parts[2]||'' });
  }
  return out;
}
/* 把结果写进花园:PASS→已长成 · FAIL→打回闪卡 · NEW→候选箱 */
async function applyExamResult(res){
  const now = new Date().toISOString();
  for (const { item, note } of res.pass){
    await q(sb.from('lang_items').update({
      status:'mastered', mastered:true, mastered_at:now, last_exam_at:now,
      exam_attempt_count:(item.exam_attempt_count||0)+1,
      example: item.example || note || null,          // 把你真的说出来的那句留作证据
    }).eq('id', item.id), true);
  }
  for (const { item } of res.fail){
    await q(sb.from('lang_items').update({
      status:'flashcard_learning', success_streak:0, review_count:0,
      first_streak_success_at:null, last_reviewed_at:now, last_exam_at:now,
      exam_attempt_count:(item.exam_attempt_count||0)+1,
      exam_fail_count:(item.exam_fail_count||0)+1,     // lifetime 不动,历史保住
    }).eq('id', item.id), true);
  }
  for (const c of res.nw){
    await q(sb.from('lang_candidates').insert({
      lang: /[ぁ-んァ-ヶー]/.test(c.expression) ? 'ja' : 'en',
      expression: c.expression, meaning: c.meaning || null,
      example: c.example || null, source: 'gpt_live',
    }), true);   // 撞到去重索引会静默跳过,正常
  }
}

/* 从「截止7/30」「截止 7 月 30 日」里抠出日期,抠不到返回 null */
function parseDue(s){
  const m = String(s||'').match(/(\d{1,2})\s*[\/月\-.]\s*(\d{1,2})/);
  if (!m) return null;
  const y = new Date().getFullYear();
  const d = `${y}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
  return /^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(d) ? d : null;
}

// 从今日进入:复习整个到期队列(从点的那个词开始),可随时点「结束复习」停下
async function startReviewQueue(startId){
  const items = (await q(sb.from('lang_items').select('*').eq('mastered', false))) || [];
  const due = items.filter(flashDue);
  if (!due.length){ toast('今天没有要复习的词'); return; }
  if (startId){ const k = due.findIndex(x => x.id === startId); if (k > 0){ const [it] = due.splice(k,1); due.unshift(it); } }
  startReview(due);
}

VIEWS.capture = async function(){

        </div>
        <div class="spread"><span class="muted" id="cap-hint">写点什么,我猜猜它属于哪里</span><button class="primary" id="cap-save">种进花园</button></div>

    if (/[぀-ヿ]/.test(t)) return '日语';
    const ascii = (t.match(/[a-zA-Z\s'.,!?-]/g)||[]).length;
    if (t.length > 4 && ascii / t.length > 0.7) return '英语';
    if (/项目|上线|进度|交付|部署/.test(t)) return '项目';
    if (/看了|读到|书里|这本书|作者/.test(t)) return '读书';
    if (/学到|复习|背|读了|课/.test(t)) return '学习';
    if (/吃|睡|散步|家|买|身体/.test(t)) return '生活';
    return '灵感';

    chips.forEach(c => c.classList.toggle('sel', c.dataset.kind === kind));

      const lang = k === '英语' ? 'en' : 'ja';
      const { data: ins } = await sb.from('lang_items').insert({ lang, expression: text, source: 'manual' }).select().single();

      toast(k + '表达已收进温室，AI 补释义中… 🌱');

      if (ins) sb.functions.invoke('garden-ai', { body:{ mode:'lookup', expression: text, lang, direction:'forward' } })
        .then(({ data }) => { if (data?.card){ const c=data.card; const meaning=[c.pron,c.pos,c.meaning].filter(Boolean).join(' '); const example=[c.example,c.example_cn].filter(Boolean).join(' / '); sb.from('lang_items').update({ meaning: meaning||null, example: example||null }).eq('id', ins.id); } })
        .catch(()=>{});
    } else {
      const tags = [];
      if (k === '读书'){
        let bk = ($('#book-in')?.value||'').trim();
        if (bk){ if (!bk.startsWith('《')) bk = '《' + bk.replace(/[《》]/g,'') + '》'; tags.push(bk); }

      toast(k==='读书' && tags.length ? '收进 ' + tags[0] + ' 了 📖' : '已种下,先安静待在「' + k + '」里');
    }
    $('#cap-text').value = ''; clearDraft('capture'); kind = null; syncChips(); route();
  };
};
async function bumpCheckin(lang, n){
  const today = todayStr();
  const cur = await q(sb.from('lang_checkins').select('*').eq('date',today).eq('lang',lang).maybeSingle(), true);
  await q(sb.from('lang_checkins').upsert({ date: today, lang, items_added: (cur?.items_added||0) + (n||0) }), true);
}

/* ================= 灵感星图 ================= */
const CLUSTERS = [
  { key:'商业', name:'赚钱与商业', color:'#BA7517', tags:['商业','销售','变现','影响力','稀缺','路径','信任','风口','力量','显化','金钱心理','marketing','商业模式'] },
  { key:'创业', name:'创业与创新', color:'#1D9E75', tags:['创业','创新','MVP','素食','壁垒','定价权','产品','营销','利他'] },
  { key:'自我', name:'自我·坚持·家庭', color:'#D85A30', tags:['坚持自我','原生家庭','自我认知','接纳','觉醒','舆论','潜意识','自我','成长'] },
  { key:'修行', name:'修行·命运·因果', color:'#7F77DD', tags:['修行','佛法','命运','因果','能量','发愿','感恩','养生','精气神','评判','摘抄'] },
  { key:'认知', name:'AI·认知·跨学科', color:'#378ADD', tags:['AI','create-to-learn','跨学科','能量信息','认知','语言','金刚经','科技','能力','未来','方法论','标准化','专精','成长系统','学习'] },
  { key:'处世', name:'处世·关系·投资', color:'#888780', tags:['处世','原则','关系','投资','周期','组织','战略','权力','平等','决断','勇气','决策'] },
];
const OTHER = { key:'其他', name:'新芽', color:'#B4B2A9' };
const CROSS = [['商业','修行'],['认知','修行'],['自我','创业'],['认知','自我']];
function clusterOf(e){ const tg=e.tags||[]; for(const c of CLUSTERS){ if(tg.some(t=>c.tags.includes(t))) return c; } return OTHER; }
function renderStar(entries){
  const wrap = document.getElementById('starwrap'); if(!wrap) return;
  const W=800, H=520, cx=W/2, cy=H/2;
  const groups = {}; CLUSTERS.forEach(c=>groups[c.key]={ c, items:[] });
  const other = { c:OTHER, items:[] };
  (entries||[]).forEach(e=>{ const c=clusterOf(e); (groups[c.key]||other).items.push(e); });
  const active = [...CLUSTERS.map(c=>groups[c.key]).filter(g=>g.items.length), ...(other.items.length?[other]:[])];
  const n = active.length || 1;
  const centers = {};
  active.forEach((g,i)=>{ const a=-Math.PI/2 + i/n*2*Math.PI; g.x=cx+258*Math.cos(a); g.y=cy+182*Math.sin(a); centers[g.c.key]={x:g.x,y:g.y}; });
  let lines='', dots='', labels='';
  active.forEach(g=>{ lines+=`<line x1="${cx}" y1="${cy}" x2="${g.x.toFixed(0)}" y2="${g.y.toFixed(0)}" stroke="var(--line)" stroke-width="1"/>`; });
  CROSS.forEach(([a,b])=>{ if(centers[a]&&centers[b]) lines+=`<line x1="${centers[a].x.toFixed(0)}" y1="${centers[a].y.toFixed(0)}" x2="${centers[b].x.toFixed(0)}" y2="${centers[b].y.toFixed(0)}" stroke="var(--mute)" stroke-width="1" stroke-dasharray="3 6" opacity="0.5"/>`; });
  active.forEach(g=>{
    const m=g.items.length;
    g.items.forEach((e,j)=>{
      const a = j/Math.max(m,1)*2*Math.PI + g.x*0.02;
      const r = 26 + (j%4)*14;
      const sx=g.x+r*Math.cos(a), sy=g.y+r*Math.sin(a);
      lines+=`<line x1="${g.x.toFixed(0)}" y1="${g.y.toFixed(0)}" x2="${sx.toFixed(1)}" y2="${sy.toFixed(1)}" stroke="${g.c.color}" stroke-width="0.6" opacity="0.3"/>`;
      dots+=`<circle class="star" data-id="${e.id}" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="5" fill="${g.c.color}" style="cursor:pointer"><title>${esc(e.title||(e.content||'').slice(0,20))}</title></circle>`;
    });
    dots+=`<circle cx="${g.x.toFixed(0)}" cy="${g.y.toFixed(0)}" r="3" fill="${g.c.color}"/>`;
    const w = g.c.name.length*13 + 12;
    labels+=`<rect x="${(g.x-w/2).toFixed(0)}" y="${(g.y-11).toFixed(0)}" width="${w}" height="20" rx="5" fill="var(--paper)" opacity="0.88"/>`;
    labels+=`<text x="${g.x.toFixed(0)}" y="${(g.y+4).toFixed(0)}" text-anchor="middle" font-size="12.5" fill="${g.c.color}">${esc(g.c.name)}</text>`;
  });
  dots+=`<circle cx="${cx}" cy="${cy}" r="7" fill="var(--accent)"/>`;
  labels+=`<rect x="${cx-16}" y="${cy-11}" width="32" height="20" rx="5" fill="var(--paper)" opacity="0.9"/><text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="13" fill="var(--ink)">你</text>`;
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${lines}${dots}${labels}</svg>
    <div class="muted" style="text-align:center;font-size:12px;padding:4px 0 8px">共 ${(entries||[]).length} 颗 · 点星星打开它 · 虚线是主题之间的暗线</div>`;
  wrap.querySelectorAll('.star').forEach(s => s.onclick = () => openSeed(s.dataset.id));
}

      <div class="row" style="margin:14px 0 4px">

      ${!pool.length ? `<div class="dashed" style="padding:20px;text-align:center;margin-top:12px">

async function recomputeProgress(id){
  const tasks = await q(sb.from('project_tasks').select('done').eq('project_id', id)) || [];
  if (!tasks.length) return;
  const prog = Math.round(tasks.filter(t=>t.done).length / tasks.length * 100);
  await q(sb.from('projects').update({ progress: prog, status: prog>=100?'done':'growing', updated_at: new Date().toISOString() }).eq('id', id));
}
function closeModal(refresh){ const m = document.querySelector('.modal-mask'); if (m) m.remove(); if (refresh) route(); }
/* 一条主线:只显示还没走的路,勾掉会落进「走过的路」。✦AI / ✎你;▶ 正在做置顶 */
function renderTasks(all, parent, depth){
  let kids = all.filter(t => (t.parent_id || null) === parent && !t.done);
  if (!kids.length) return '';
  if (depth === 0) kids = [...kids.filter(t=>t.started_at), ...kids.filter(t=>!t.started_at)];  // 正在做的排前面
  return kids.map(t => {
    const isAI = t.source === 'ai';
    const hasKids = all.some(x => x.parent_id === t.id && !x.done);
    const doing = !!t.started_at;
    return `<div class="check" style="padding-left:${depth*20}px">
      <input type="checkbox" data-task="${t.id}">
      <span class="tt">${doing?'<span style="color:var(--grow)">▶ </span>':''}${esc(t.title)}
        <span class="muted" style="font-size:11px;margin-left:4px" title="${isAI?'AI 拆解':'你添加'}">${isAI?'✦':'✎'}</span>
        ${doing?`<span class="muted" style="font-size:11px;margin-left:4px">做了 ${daysSince(t.started_at)} 天</span>`:''}</span>
      <button class="ghost" data-tdoing="${t.id}" data-on="${doing?1:0}" style="font-size:12px" title="${doing?'取消正在做':'标记正在做'}">${doing?'▪':'▶'}</button>
      ${depth<2&&!hasKids ? `<button class="ghost" data-tsub="${t.id}" style="font-size:12px" title="再拆一层">⌄</button>` : ''}
      <button class="ghost" data-tdel="${t.id}" style="font-size:12px">删</button></div>`
      + renderTasks(all, t.id, depth+1);
  }).join('');
}
/* 走过的路:完成的任务 + 手写的记录,按日期分组 */
function renderPath(doneTasks, notes){
  const dayLabel = d => { const t=todayStr(); const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
    return d===t?'今天':d===y?'昨天':d.slice(5).replace('-','/'); };
  const items = [
    ...doneTasks.map(t=>({ kind:'task', id:t.id, text:t.title, src:t.source, at:t.done_at||t.created_at })),
    ...notes.map(n=>({ kind:'note', id:n.id, text:n.note, at:n.created_at })),
  ].sort((a,b)=> new Date(b.at) - new Date(a.at));
  if (!items.length) return '<div class="muted">还没有走过的路。做完一件,或写下今天发生了什么。</div>';
  const groups = {};
  items.forEach(i=>{ const d=new Date(i.at).toISOString().slice(0,10); (groups[d]=groups[d]||[]).push(i); });
  return Object.keys(groups).sort().reverse().map(d=>`
    <div style="margin-top:12px"><div class="washi" style="font-size:12px">${dayLabel(d)}</div>
    <div class="timeline" style="margin-top:8px">${groups[d].map(i=> i.kind==='task'
      ? `<div class="ev"><div class="spread"><div class="desc" style="flex:1"><span style="color:var(--done)">✓</span> ${esc(i.text)} <span class="muted" style="font-size:11px">${i.src==='ai'?'✦':'✎'}</span></div>
          <button class="ghost" data-tback="${i.id}" style="font-size:12px;flex:0 0 auto" title="放回主线">↑</button></div></div>`
      : `<div class="ev"><div class="spread"><div class="desc" style="flex:1">${esc(i.text)}</div>
          <div class="row" style="gap:6px;flex:0 0 auto"><button class="ghost" data-n2t="${i.id}" style="font-size:12px">→待办</button><button class="ghost" data-nedit="${i.id}" style="font-size:12px">改</button><button class="ghost" data-ndel="${i.id}" style="font-size:12px;color:var(--danger)">×</button></div></div></div>`
    ).join('')}</div></div>`).join('');
}

    <h3 style="font-family:var(--serif);font-weight:600;margin:22px 0 4px">接下来 · 主线</h3>

    ${(tasks||[]).some(t=>!t.done) ? renderTasks(tasks||[], null, 0)

  mask.querySelectorAll('[data-tsub]').forEach(b => b.onclick = async () => {

async function calcStreak(){
  const rows = await q(sb.from('lang_checkins').select('date')) || [];
  const days = [...new Set(rows.map(r=>r.date))].sort().reverse();
  let streak = 0; const d = new Date();
  if (!days.includes(todayStr())) d.setDate(d.getDate()-1); // 今天还没打卡就从昨天数
  for (;;){
    const s = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if (days.includes(s)){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}

    catch { showExamPrompt(txt); toast('复制不了,手动选中下面这段'); }
  });
  $('#exam-see') && ($('#exam-see').onclick = () => showExamPrompt(examPrompt(examReady.slice(0,5))));
  document.querySelectorAll('[data-exkeep]').forEach(b => b.onclick = async () => {
    await q(sb.from('lang_items').update({ exam_fail_count: 0 }).eq('id', b.dataset.exkeep));
    toast('好,再给它一次机会 🌱'); VIEWS.lang();
  });
  document.querySelectorAll('[data-exdrop]').forEach(b => b.onclick = async () => {
    await q(sb.from('lang_items').update({ status:'suspended' }).eq('id', b.dataset.exdrop));
    toast('放下了。不是每个词都得学会 🍂'); VIEWS.lang();
  });
  $('#exam-in') && keepDraft($('#exam-in'), 'exam');
  $('#exam-apply') && ($('#exam-apply').onclick = async (ev) => {
    const txt = $('#exam-in').value.trim();
    if (!txt) return toast('先把 Live 给的那几行贴进来');
    const res = parseExamResult(txt, examReady);
    if (!res.pass.length && !res.fail.length && !res.nw.length)
      return toast('没读到 PASS / FAIL / NEW 开头的行,格式对吗?');
    await applyExamResult(res);
    if (res.pass.length) celebrate(ev.currentTarget, ['🌿','🎓','✦','✧']);
    bounce(document.querySelector('.bean'), 'cheer');
    clearDraft('exam');
    const bits = [];
    if (res.pass.length) bits.push(`${res.pass.length} 个长成了 🌿`);
    if (res.fail.length) bits.push(`${res.fail.length} 个回炉`);
    if (res.nw.length)   bits.push(`${res.nw.length} 个进候选箱`);
    if (res.unknown.length) bits.push(`${res.unknown.length} 个没对上(${res.unknown.slice(0,2).join('、')})`);
    toast(bits.join(' · ')); VIEWS.lang();
  });
  /* ——— 候选箱 ——— */
  document.querySelectorAll('[data-candyes]').forEach(b => b.onclick = async () => {
    const c = (cands||[]).find(x=>x.id===b.dataset.candyes); if (!c) return;
    celebrate(b, ['🌱','✦','✧']);
    await q(sb.from('lang_items').insert({
      lang:c.lang, expression:c.expression, meaning:c.meaning||null,
      example:c.example||null, source:'gpt_live', status:'new' }));
    await q(sb.from('lang_candidates').update({ handled:true }).eq('id', c.id), true);
    await bumpCheckin(c.lang, 1);
    toast('收下了,明天开始复习它 🌱'); VIEWS.lang();
  });
  document.querySelectorAll('[data-candno]').forEach(b => b.onclick = async () => {
    await q(sb.from('lang_candidates').update({ handled:true }).eq('id', b.dataset.candno), true);
    toast('那就不学它'); VIEWS.lang();
  });
  $('#cand-none') && ($('#cand-none').onclick = async () => {
    if (!confirm(`把这 ${cands.length} 个候选表达全部清掉?`)) return;
    await q(sb.from('lang_candidates').update({ handled:true }).eq('handled', false), true);
    toast('候选箱清空了'); VIEWS.lang();
  });
};
// 保存一张查词卡到温室
async function saveCard(lang, card){
  const meaning = [card.pron, card.pos, card.meaning].filter(Boolean).join(' ');

      <button data-wr="mastered">已长成 🌿</button>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="ghost" data-wedit>✎ 编辑</button>
      <button class="ghost" data-wlook>🔄 AI 重查</button>
      <button class="ghost" data-wdel style="color:var(--danger)">删除</button>
    </div>
   </div></div>`);

    toast(b.dataset.wr==='forgot'?'没关系，过几天再见它 ↻':b.dataset.wr==='mastered'?'这颗已经长成 🌿':'浇过水了 ✓');
    closeModal(true);
  });
  mask.querySelector('[data-wedit]').onclick = async () => {
    const m = prompt('释义：', i.meaning||''); if (m === null) return;

    await q(sb.from('lang_items').update({ meaning: m||null, example: (e===null?i.example:e)||null }).eq('id', id));

  mask.querySelector('[data-wlook]').onclick = async () => {
    const btn = mask.querySelector('[data-wlook]'); btn.textContent = '查询中…'; btn.disabled = true;
    try {
      const { data } = await sb.functions.invoke('garden-ai', { body:{ mode:'lookup', expression:i.expression, lang:i.lang, direction:'forward' } });
      if (data?.card){ const c=data.card; const meaning=[c.pron,c.pos,c.meaning].filter(Boolean).join(' '); const example=[c.example,c.example_cn].filter(Boolean).join(' / '); await q(sb.from('lang_items').update({ meaning: meaning||i.meaning, example: example||i.example }).eq('id', id)); }
    } catch (e) { /* ignore */ }
    openWord(id);
  };
  mask.querySelector('[data-wdel]').onclick = async () => {
    if (!confirm('删除「'+i.expression+'」？')) return;
    await q(sb.from('lang_items').delete().eq('id', id)); toast('已删除'); closeModal(true);
  };
}

/* 专注复习:一次一张卡 */
async function srsMark(i, kind){
  await bumpCheckin(i.lang, 0);   // 复习也算今天浇过水
  const now  = new Date().toISOString();
  const life = (i.lifetime_review_count ?? i.review_count ?? 0) + 1;
  if (kind === 'remembered'){
    const streak = streakOf(i) + 1;
    const first  = i.first_streak_success_at || now;     // 本轮连胜的起点
    const grad   = canGraduate(streak, first);
    if (grad) toast('这个词可以去毕业考了 🎓');
    return q(sb.from('lang_items').update({
      success_streak: streak, lifetime_review_count: life,
      review_count: streak,                              // 兼容旧代码/定时任务
      first_streak_success_at: first, last_reviewed_at: now,
      status: grad ? 'exam_ready' : 'flashcard_learning',
    }).eq('id', i.id));
  }
  if (kind === 'forgot') return q(sb.from('lang_items').update({
      success_streak: 0, lifetime_review_count: life, review_count: 0,
      first_streak_success_at: null, last_reviewed_at: now, status: 'flashcard_learning',
    }).eq('id', i.id));
  if (kind === 'mastered') return q(sb.from('lang_items').update({
      mastered: true, status: 'mastered', mastered_at: now }).eq('id', i.id));
}
function startReview(list){
  let idx = 0;
  const render = () => {
    document.querySelector('.modal-mask')?.remove();
    if (idx >= list.length){ toast('复习完成 🌿 共 ' + list.length + ' 张'); route(); return; }
    const i = list[idx];
    const zh   = i.lang === 'en' ? '英语' : '日语';
    // 正面放中文,让你先「说得出」;没有释义的词退回旧模式(否则正面是空的)
    const hasMean = !!String(i.meaning || '').trim();
    document.body.insertAdjacentHTML('beforeend', `
     <div class="modal-mask"><div class="modal" style="max-width:520px;text-align:center">
      <div class="spread"><span class="chip">${zh}</span><div class="row" style="gap:10px"><span class="muted">${idx+1} / ${list.length}</span><button class="ghost" data-end style="font-size:12px">结束复习</button></div></div>
      ${hasMean ? `
        <h2 style="margin:26px 0 4px;font-size:23px;line-height:1.4">${esc(i.meaning)}</h2>
        <div class="muted" style="font-size:13px;margin-bottom:4px">想一想 —— 用${zh}怎么说?</div>
        <div id="rev-mean" class="hidden">
          <div class="wave"></div>
          <div style="font-size:26px;font-weight:600;margin:2px 0 6px">${esc(i.expression)}</div>
          ${i.example ? `<div class="muted" style="font-size:13px">${esc(i.example)}</div>` : ''}
        </div>`
      : `
        <h2 style="margin:28px 0 4px;font-size:26px">${esc(i.expression)}</h2>
        <div class="muted" style="font-size:13px;margin-bottom:4px">这条还没有释义 —— 凭感觉回想</div>
        <div id="rev-mean" class="hidden">
          <div class="wave"></div>
          ${i.example ? `<div class="muted" style="font-size:13px">${esc(i.example)}</div>` : '<div class="muted" style="font-size:13px">去语言页点开它,补一个释义 🌱</div>'}
        </div>`}
      <button id="rev-flip" class="ghost" style="margin:8px 0 18px">翻面看答案 ↺</button>
      <div class="row" style="justify-content:center">
        <button data-r="forgot">没记住 ↻</button>
        <button data-r="remembered">记得 ✓</button>
        <button data-r="mastered">已长成 🌿</button>
      </div>
     </div></div>`);
    const mask = document.querySelector('.modal-mask');
    mask.addEventListener('click', ev => { if (ev.target === mask){ mask.remove(); route(); } });
    mask.querySelector('#rev-flip').onclick = (ev) => {
      mask.querySelector('#rev-mean').classList.remove('hidden');
      ev.currentTarget.style.display = 'none';        // 翻过了就把按钮收掉
    };
    mask.querySelector('[data-end]').onclick = () => { mask.remove(); toast('今天复习就到这 🌿'); route(); };
    mask.querySelectorAll('[data-r]').forEach(b => b.onclick = async () => { await srsMark(i, b.dataset.r); idx++; render(); });
  };
  render();
}

/* ================= 回顾 ================= */
VIEWS.review = async function(){
  const [entries, projs, insights] = await Promise.all([
    q(sb.from('entries').select('*')),
    q(sb.from('projects').select('*')),
    q(sb.from('ai_insights').select('*').eq('scope','weekly_review').order('date',{ascending:false}).limit(1)),
  ]);
  // 想法不参与"待处理"的压力计数:行动(项目)才算待办,想法只看留下了多少
  const cnt = st => (projs||[]).filter(p=>p.status===st).length;
  const CARDS = [ ['growing','正在被照料的行动'], ['waiting','暂时交给外部条件'], ['done','这次行动已经结束'], ['released','经过判断后安心不再继续'] ];
  const ideaTotal = (entries||[]).length;
  const ideaGrowing = (entries||[]).filter(e=>e.status==='growing').length;
  const ideaSettled = (entries||[]).filter(e=>e.status==='settled'||e.status==='done').length;
  const weekAgo = new Date(Date.now() - 6*86400000);
  const thisWeek = (entries||[]).filter(e => new Date(e.occurred_on) >= weekAgo)
    .sort((a,b)=>b.occurred_on.localeCompare(a.occurred_on));
  const ins = (insights||[])[0];
  const total = (entries||[]).length;
  $('#view').innerHTML = `
    <div class="eyebrow">这一周的生长</div>
    <h1 class="hero">慢慢看见自己靠近了什么</h1>
    <p class="sub">${ideaTotal} 个想法留在花园里,${cnt('done')} 项行动已经走完。想法不必被催,它们只是在那儿等季节。</p>
    <div class="spread" style="margin-bottom:14px"><span></span><button id="btn-export">导出花园数据</button></div>
    <h2 class="sec">行动</h2>
    <div class="grid g3">
      ${CARDS.map(([st,tip])=>`<div class="card">${chip(st)}<div class="bignum">${cnt(st)}</div><div class="muted">${tip}</div></div>`).join('')}
    </div>
    <h2 class="sec">想法</h2>
    <div class="card"><div class="row" style="gap:26px">
      <span class="muted"><b style="color:var(--ink);font-size:20px;font-family:var(--hand-mix)">${ideaTotal}</b> 个想法留下了</span>
      <span class="muted"><b style="color:var(--grow);font-size:20px;font-family:var(--hand-mix)">${ideaGrowing}</b> 正在生长</span>
      <span class="muted"><b style="color:var(--done);font-size:20px;font-family:var(--hand-mix)">${ideaSettled}</b> 已沉淀成东西</span>
    </div><div class="muted" style="margin-top:8px;font-size:12.5px">🌱 想法不算待办,它们只是种在那里,等你想起。</div></div>
    <h2 class="sec">本周留下的</h2>
    <div class="card">
      ${thisWeek.map(e=>`<div class="itemline"><div><div class="muted">${fmtMD(e.occurred_on)} · ${esc(e.kind)}</div><div class="desc">${esc(e.title||e.content.slice(0,42))}</div></div>${chip(e.status)}</div>`).join('') || '<div class="desc muted">这一周还没有留下记录。</div>'}
    </div>
    <h2 class="sec">每周洞察</h2>
    <div class="${ins?'card':'note'}">${ins ? `<div class="muted">${esc(ins.date)}</div><div class="desc" style="white-space:pre-wrap">${esc(ins.content_md)}</div>` : '每周日 Claude 会在这里写一段:什么在生长、什么在停滞、什么在等待。'}</div>`;
  $('#btn-export').onclick = async () => {
    const tables = ['entries','projects','project_updates','daily_state','lang_items','lang_checkins','mail_briefs','ai_insights'];
    const out = { version: 2, exportedAt: new Date().toISOString() };
    for (const t of tables) out[t] = await q(sb.from(t).select('*')) || [];
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(out,null,2)], {type:'application/json'}));
    a.download = 'insight-garden-' + todayStr() + '.json'; a.click();
    toast('花园已经装箱 📦');
  };
};
